[project]
name = "trading-agent-framework"
version = "0.1.0"
description = "A trading agent harness managing runtime, the broker layer, agent layer, memory etc."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alpaca-py>=0.44.0,<0.45",
    "pandas-ta-classic>=0.6.52,<0.7",
    "python-dotenv>=1.2",
]

[project.scripts]
agent = "trading_agent_framework.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent_framework"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 200
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:remove second argument of ws_handler:DeprecationWarning",
    "ignore::DeprecationWarning:websockets.legacy",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
